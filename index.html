<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danae Guzmán | Arte & Reseñas</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Cursor personalizado -->
    <div id="cursor-dot"></div>
    <div id="cursor-outline"></div>

    <!-- Barra de progreso de scroll -->
    <div class="scroll-progress" id="scroll-progress"></div>

    <nav id="navbar">
        <div class="logo">Danae Guzmán</div>
        <ul class="nav-links">
            <li><a href="#arte">Arte</a></li>
            <li><a href="#libros">Libros</a></li>
            <li><a href="https://www.instagram.com/book.ish_db/" target="_blank" rel="noopener" class="nav-ig">@book.ish_db</a></li>
        </ul>
    </nav>

    <header class="hero" id="hero">
        <video autoplay loop muted playsinline class="hero-video">
            <source src="assets/video/dragon-loop2.mp4" type="video/mp4">
        </video>
        <div class="hero-overlay"></div>

        <div class="hero-content">
            <h1 id="hero-title">Lienzos & Letras</h1>
            <p>Explorando mundos a través del pincel y la palabra.</p>
        </div>

        <!-- Selector de sección -->
        <div class="hero-selector">
            <a href="#arte" class="selector-panel" id="panel-arte">
                <img src="assets/arte/collage-flamenco-palace.jpeg" alt="" class="selector-bg">
                <div class="selector-scrim"></div>
                <div class="selector-label">
                    <span class="selector-kicker">Explorar</span>
                    <span class="selector-title">Arte</span>
                </div>
            </a>
            <a href="#libros" class="selector-panel" id="panel-libros">
                <img src="assets/libros/reseña-once-upon-a-broken-heart.jpeg" alt="" class="selector-bg">
                <div class="selector-scrim"></div>
                <div class="selector-label">
                    <span class="selector-kicker">Descubrir</span>
                    <span class="selector-title">Libros</span>
                </div>
            </a>
        </div>
    </header>

    <main>
        <!-- ================= ARTE: pantalla completa ================= -->
        <section id="arte" class="fullscreen-carousel">
            <div class="fs-bg" id="arte-bg-a"></div>
            <div class="fs-bg" id="arte-bg-b"></div>
            <span class="fs-section-label">Arte</span>
            <button class="carousel-arrow prev" id="arte-prev" aria-label="Anterior">‹</button>
            <button class="carousel-arrow next" id="arte-next" aria-label="Siguiente">›</button>
            <div class="fs-frame">
                <div class="carousel-track" id="arte-track"></div>
            </div>
            <div class="fs-caption" id="arte-caption"></div>
            <div class="carousel-dots" id="arte-dots"></div>
        </section>

        <!-- ================= LIBROS: pantalla completa ================= -->
        <section id="libros" class="fullscreen-carousel">
            <div class="fs-bg" id="libros-bg-a"></div>
            <div class="fs-bg" id="libros-bg-b"></div>
            <span class="fs-section-label">Libros</span>
            <button class="carousel-arrow prev" id="libros-prev" aria-label="Anterior">‹</button>
            <button class="carousel-arrow next" id="libros-next" aria-label="Siguiente">›</button>
            <div class="fs-frame">
                <div class="carousel-track" id="libros-track"></div>
            </div>
            <div class="fs-caption" id="libros-caption"></div>
            <div class="carousel-dots" id="libros-dots"></div>
        </section>
    </main>

    <footer class="site-footer">
        <a href="https://www.instagram.com/book.ish_db/" target="_blank" rel="noopener">@book.ish_db en Instagram</a>
    </footer>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
        <button class="lightbox-close" id="lightbox-close">&times;</button>
        <img src="" alt="" id="lightbox-img">
    </div>

    <!-- Botón flotante de Instagram (discreto) -->
    <a href="https://www.instagram.com/book.ish_db/" target="_blank" rel="noopener" class="ig-floating-btn" id="ig-floating-btn" aria-label="Síguenos en Instagram">
        <span>@</span>
    </a>

    <script src="script.js"></script>
</body>
</html>
